name: Backend CI

# 后端 PR 验证：format + lint + typecheck + test（no LLM live runs）
# 覆盖根包 ydsz-worker；gateway/harness/memory/browser 由各自仓库的 CI 负责。

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci-backend.yml"
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci-backend.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── format + lint（ruff）──────────────────────────────────────────
  lint:
    name: "Lint (ruff)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: "Ruff check"
        run: uv run ruff check src tests
      - name: "Ruff format check"
        run: uv run ruff format --check src tests

  # ── typecheck（mypy --strict）────────────────────────────────────
  typecheck:
    name: "Typecheck (mypy)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: "Sync deps"
        run: uv sync --frozen --no-dev
      - name: "Install dev tools"
        run: uv sync --frozen
      - name: "Mypy strict"
        run: uv run mypy --strict src/ydsz

  # ── unit + integration tests（no LLM）────────────────────────────
  test:
    name: "Tests (py ${{ matrix.python }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: "Sync deps"
        run: uv sync --frozen
      - name: "Run tests (no live)"
        run: uv run pytest -m "not live" -x -q --no-header
